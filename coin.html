<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>Coin Flip</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .coin-container {
            perspective: 1000px;
            margin-bottom: 30px;
        }
        .coin {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }
        .coin.flipping {
            animation: flip 0.5s linear infinite;
        }
        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            backface-visibility: hidden;
            border: 8px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .heads {
            background: linear-gradient(135deg, #f5d742 0%, #d4af37 100%);
        }
        .tails {
            background: linear-gradient(135deg, #c0c0c0 0%, #a8a8a8 100%);
            transform: rotateY(180deg);
        }
        .coin.show-heads { transform: rotateY(0deg); }
        .coin.show-tails { transform: rotateY(180deg); }
        .result-name {
            font-size: 1.5rem;
            margin-top: 10px;
            color: #d4af37;
        }
        .nav-link {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-link">🎡 Wheel</a>
    <div class="container">
        <h1>Coin Flip</h1>
        <div class="coin-container">
            <div class="coin" id="coin">
                <div class="coin-face heads">🇷🇺</div>
                <div class="coin-face tails">🇺🇸</div>
            </div>
        </div>
        <button id="flipBtn" class="spin-button">FLIP!</button>
        <div id="result" class="result"></div>
        <div id="resultName" class="result-name"></div>
    </div>
    <script>
        const coin = document.getElementById('coin');
        const flipBtn = document.getElementById('flipBtn');
        const resultDiv = document.getElementById('result');
        const resultName = document.getElementById('resultName');
        let isFlipping = false;

        function flip() {
            if (isFlipping) return;
            isFlipping = true;
            flipBtn.disabled = true;
            resultDiv.textContent = '';
            resultName.textContent = '';
            
            coin.classList.remove('show-heads', 'show-tails');
            coin.classList.add('flipping');
            
            const isHeads = Math.random() < 0.5;
            
            setTimeout(() => {
                coin.classList.remove('flipping');
                coin.classList.add(isHeads ? 'show-heads' : 'show-tails');
                
                if (isHeads) {
                    resultDiv.textContent = 'HEADS!';
                    resultName.textContent = '🇷🇺 Vladimir Putin';
                } else {
                    resultDiv.textContent = 'TAILS!';
                    resultName.textContent = '🇺🇸 Donald Trump';
                }
                
                isFlipping = false;
                flipBtn.disabled = false;
            }, 2000);
        }

        flipBtn.addEventListener('click', flip);
    </script>
</body>
</html>
