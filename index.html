<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Decision App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
</head>

<body>
    <!-- Splash Screen -->
    <div id="splash" class="splash">
        <div class="splash-icon">🎡</div>
        <div class="splash-text">Decision App</div>
    </div>

    <!-- Offline Banner -->
    <div id="offline" class="offline-banner hidden">📴 You're offline</div>

    <!-- Confetti Canvas -->
    <canvas id="confetti"></canvas>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <button id="langToggle" class="icon-btn">🇩🇪</button>
            <button id="themeToggle" class="icon-btn">🌙</button>
            <button id="historyBtn" class="icon-btn">📜</button>
            <button id="fullscreenBtn" class="icon-btn">⛶</button>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="wheel">🎡</button>
            <button class="tab" data-tab="coin">🪙</button>
            <button class="tab" data-tab="dice">🎲</button>
            <button class="tab" data-tab="number">🔢</button>
            <button class="tab" data-tab="person">👤</button>
            <button class="tab" data-tab="food">🍕</button>
            <button class="tab" data-tab="movie">🎬</button>
            <button class="tab" data-tab="pays">🍺</button>
            <button class="tab" data-tab="music">🎵</button>
            <button class="tab" data-tab="dare">💪</button>
            <button class="tab" data-tab="travel">🌍</button>
            <button class="tab" data-tab="game">🎮</button>
            <button class="tab" data-tab="magic8">🔮</button>
            <button class="tab" data-tab="slots">🎰</button>
        </div>

        <div id="wheel-section" class="section active">
            <h1>Custom Wheel</h1>
            <input type="text" id="wheelInput" class="custom-input" placeholder="Add option + Enter">
            <div class="custom-list" id="wheelList"></div>
            <div class="wheel-container"><canvas id="wheel" width="300" height="300"></canvas></div>
            <button id="spinBtn" class="spin-button">SPIN!</button>
            <div id="wheelResult" class="result"></div>
            <button id="wheelShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="coin-section" class="section">
            <h1>Coin Flip</h1>
            <div class="coin-container">
                <div class="coin" id="coin">
                    <div class="coin-face heads">🇷🇺</div>
                    <div class="coin-face tails">🇺🇸</div>
                </div>
            </div>
            <button id="flipBtn" class="spin-button">FLIP!</button>
            <div id="coinResult" class="result"></div>
            <div id="coinName" class="result-name"></div>
            <button id="coinShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="dice-section" class="section">
            <h1>Dice Roll</h1>
            <div class="display dice-display" id="diceDisplay">🎲</div>
            <button id="diceBtn" class="spin-button">ROLL!</button>
            <div id="diceResult" class="result"></div>
            <button id="diceShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="number-section" class="section">
            <h1>Random Number</h1>
            <div class="display number-display" id="numberDisplay">?</div>
            <button id="randomBtn" class="spin-button">GENERATE!</button>
            <div id="numberResult" class="result"></div>
            <button id="numberShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="person-section" class="section">
            <h1>Random Person</h1>
            <input type="text" id="personInput" class="custom-input" placeholder="Add name + Enter">
            <div class="custom-list" id="personList"></div>
            <div class="display person-display" id="personDisplay">?</div>
            <button id="personBtn" class="spin-button">PICK!</button>
            <div id="personResult" class="result"></div>
            <button id="personShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="food-section" class="section">
            <h1>What to Eat?</h1>
            <div class="display food-display" id="foodDisplay">🍽️</div>
            <button id="foodBtn" class="spin-button">DECIDE!</button>
            <div id="foodResult" class="result"></div>
            <button id="foodShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="movie-section" class="section">
            <h1>Movie Genre</h1>
            <div class="display movie-display" id="movieDisplay">🎬</div>
            <button id="movieBtn" class="spin-button">PICK!</button>
            <div id="movieResult" class="result"></div>
            <button id="movieShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="pays-section" class="section">
            <h1>Who Pays?</h1>
            <input type="text" id="paysInput" class="custom-input" placeholder="Add name + Enter">
            <div class="custom-list" id="paysList"></div>
            <div class="display pays-display" id="paysDisplay">💸</div>
            <button id="paysBtn" class="spin-button">DECIDE!</button>
            <div id="paysResult" class="result"></div>
            <button id="paysShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="music-section" class="section">
            <h1>Music Roulette</h1>
            <div class="display music-display" id="musicDisplay">🎵</div>
            <button id="musicBtn" class="spin-button">SPIN!</button>
            <div id="musicResult" class="result"></div>
            <button id="musicShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="dare-section" class="section">
            <h1>Dare Challenge</h1>
            <div class="display dare-display" id="dareDisplay">💪</div>
            <button id="dareBtn" class="spin-button">DARE!</button>
            <div id="dareResult" class="result"></div>
            <button id="dareShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="travel-section" class="section">
            <h1>Where to Travel?</h1>
            <div class="display travel-display" id="travelDisplay">✈️</div>
            <button id="travelBtn" class="spin-button">GO!</button>
            <div id="travelResult" class="result"></div>
            <button id="travelShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="game-section" class="section">
            <h1>What to Play?</h1>
            <div class="display game-display" id="gameDisplay">🎮</div>
            <button id="gameBtn" class="spin-button">PICK!</button>
            <div id="gameResult" class="result"></div>
            <button id="gameShare" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="magic8-section" class="section">
            <h1>Magic 8-Ball</h1>
            <div class="display magic8-display" id="magic8Display">🔮</div>
            <button id="magic8Btn" class="spin-button">ASK!</button>
            <div id="magic8Result" class="result"></div>
            <button id="magic8Share" class="share-btn hidden">Share 📤</button>
        </div>

        <div id="slots-section" class="section">
            <h1>Casino Slots</h1>
            <div class="slots-machine">
                <div class="slots-row">
                    <div class="slot-reel" id="reel1">🍒</div>
                    <div class="slot-reel" id="reel2">🍋</div>
                    <div class="slot-reel" id="reel3">🍇</div>
                </div>
            </div>
            <button id="slotsBtn" class="spin-button">PULL!</button>
            <div id="slotsResult" class="result"></div>
            <button id="slotsShare" class="share-btn hidden">Share 📤</button>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <h2>History 📜</h2>
            <div id="historyList"></div>
            <button id="clearHistory" class="spin-button">Clear</button>
            <button id="closeHistory" class="spin-button">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
